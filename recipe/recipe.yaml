context:
  version: "0.4.1"
  python_min: "3.10"

package:
  name: napari-metadata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/napari-metadata/napari_metadata-${{ version }}.tar.gz
  sha256: e41dd0d7a8f27125b986fe824199ae5dcb9942994fb5656bf0c951c3518ae1e8

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python >=${{ python_min }}
    - setuptools >=77.0.3
    - setuptools_scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - qtpy
    - pint
    - superqt >=0.8.2
    - typing_extensions

tests:
  - python:
      imports:
        - napari_metadata.units
      pip_check: true

about:
  summary: View and edit napari layer metadata
  description: |
    napari-metadata is a plugin that exposes napari layer metadata as a GUI for
    viewing and editing.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/napari/napari-metadata
  homepage: https://github.com/napari/napari-metadata
  documentation: https://github.com/napari/napari-metadata#README.md

extra:
  recipe-maintainers:
    - conda-forge/napari
    - carlosmariorr
    - TimMonko
